# Nginx reverse proxy configuration for AWS Cost Optimizer
#
# This configuration proxies requests from your domain to the app container.
# Useful when running behind a reverse proxy with SSL termination.
#
# Usage:
#   1. Replace "your-domain.example.com" with your actual domain
#   2. Update SSL certificate paths if using HTTPS
#   3. Add this to your nginx config or use docker-compose with an nginx container

upstream aws-cost-optimizer {
    server app:5000;
}

server {
    listen 80;
    server_name your-domain.example.com;

    # Redirect HTTP to HTTPS (uncomment if using SSL)
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass http://aws-cost-optimizer;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Analysis scans can take several minutes
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
    }
}


apiVersion: v1
kind: Secret
metadata:
  name: aws-cost-optimizer-secrets
  namespace: aws-cost-optimizer
  labels:
    app: aws-cost-optimizer
type: Opaque
# Replace the values below with your base64-encoded credentials:
#   echo -n 'your-access-key' | base64
#   echo -n 'your-secret-key' | base64
#   echo -n "$(openssl rand -hex 32)" | base64
stringData:
  aws-access-key-id: "REPLACE_WITH_YOUR_ACCESS_KEY"
  aws-secret-access-key: "REPLACE_WITH_YOUR_SECRET_KEY"
  secret-key: "REPLACE_WITH_A_RANDOM_STRING"
